name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # spotlessCheck: formatting and Compose conventions; lintDebug: Android Lint plus the
      # design-system checks in :lint-rules (no colours, sizes, shapes or text outside core:ui).
      - name: Format, unit tests, lint and debug build
        run: >
          ./gradlew spotlessCheck testDebugUnitTest :core:model:test :core:network:test :lint-rules:test
          lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
