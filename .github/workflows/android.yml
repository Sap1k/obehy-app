name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest :core:model:test :core:network:test lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: '**/build/reports/'
